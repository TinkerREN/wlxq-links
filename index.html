<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩乐猩球-链接导航</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- 引入外部 CSS 文件 -->
    <link rel="stylesheet" href="style.css">
    <script src="iconfont/iconfont.js"></script>
</head>
<body>
    <div class="bg prism">
        <div class="bg--wrap">
            <div class="bg--gradient"></div>
            <div class="bg--aurora"></div>
            <div class="bg--moon"></div>
            <div class="bg--shine">
                <div class="bg--shine__wrap">
                    <div class="bg--shine__item diamond-pink"></div>
                    <div class="bg--shine__item diamond-yellow"></div>
                    <div class="bg--shine__item diamond-white"></div>
                    <div class="bg--shine__item star-white"></div>
                    <div class="bg--shine__item star-yellow i1"></div>
                    <div class="bg--shine__item star-yellow i2"></div>
                </div>
            </div>
            <div class="bg--cloud">
                <div class="bg--cloud__item i1"></div>
                <div class="bg--cloud__item i2"></div>
                <div class="bg--cloud__item i3"></div>
                <div class="bg--cloud__item i4"></div>
                <div class="bg--cloud__item i5"></div>
                <div class="bg--cloud__item i6"></div>
            </div>
            <div class="bg--star__item i1"></div>
            <div class="bg--star__item i2"></div>
            <div class="bg--star__item i3"></div>
            <div class="bg--star__item i4"></div>
            <div class="bg--star__item i5"></div>
            <div class="bg--star__item i6"></div>
            <div class="bg--star__item i7"></div>
        </div>
    </div>
    <div class="container">
        <img src="image/logo.jpg" alt="玩乐猩球logo" class="logo">
        
        <!-- 导航按钮列表 -->
        <div class="links">
            <a href="https://qm.qq.com/q/jvbzp6gCvC" class="glass-btn">
                <div class="btn-icon">
                    <svg class="icon" aria-hidden="true">
                        <use xlink:href="#icon-QQqun"></use>
                    </svg>
                </div>
                <span class="btn-text">玩家QQ群</span>
                <span class="btn-arrow">点击前往-&gt;</span>
            </a>
            <a href="https://live.bilibili.com/1972735011" class="glass-btn">
                <div class="btn-icon">
                    <svg class="icon" aria-hidden="true">
                        <use xlink:href="#icon-zhibolive"></use>
                    </svg>
                </div>
                <span class="btn-text">机厅直播</span>
                <span class="btn-arrow">点击前往-&gt;</span>
            </a>
            <a href="https://rec-dl.tinkerren.cn" class="glass-btn">
                <div class="btn-icon">
                    <svg class="icon" aria-hidden="true">
                        <use xlink:href="#icon-luxiangxiazai"></use>
                    </svg>
                </div>
                <span class="btn-text">录像下载</span>
                <span class="btn-arrow">点击前往-&gt;</span>
            </a>
            <!-- 当前赛事（无赛事，不可点击） -->
        <a href="https://maievent.tinkerren.cn/" class="glass-btn disabled">
        <div class="btn-icon">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-bisai"></use>
            </svg>
        </div>
        <span class="btn-text">猩球杯赛事</span>
        <span class="btn-arrow">当前无赛事</span>
    </a>
        </div>
        <div class="footer">
            <p>&copy; 2026 玩乐猩球. All Rights Reserved.</p>
            <p>技术支持：<a href="https://www.tinkerren.cn" target="_blank">TinkerREN</a></p>
        </div>
    </div>
</body>
</html>
